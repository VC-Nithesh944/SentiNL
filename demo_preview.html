<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentiNL - Sentiment Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --surface: #ffffff;
            --fg: #1a1a1a;
            --fg-muted: #6b6b6b;
            --accent: #d9534f;
            --accent-soft: #fce8e7;
            --positive: #2e7d4a;
            --positive-bg: #e8f5ec;
            --negative: #c0392b;
            --negative-bg: #fceae9;
            --border: #e5e2de;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #1a1a1a;
                --surface: #252525;
                --fg: #f0f0f0;
                --fg-muted: #a0a0a0;
                --accent: #e85a54;
                --accent-soft: #3d2524;
                --positive: #4caf7a;
                --positive-bg: #1e3327;
                --negative: #e74c3c;
                --negative-bg: #3d2422;
                --border: #3a3a3a;
                --shadow: 0 2px 8px rgba(0,0,0,0.3);
            }
        }
        :root[data-theme="dark"] {
            --bg: #1a1a1a;
            --surface: #252525;
            --fg: #f0f0f0;
            --fg-muted: #a0a0a0;
            --accent: #e85a54;
            --accent-soft: #3d2524;
            --positive: #4caf7a;
            --positive-bg: #1e3327;
            --negative: #e74c3c;
            --negative-bg: #3d2422;
            --border: #3a3a3a;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--fg-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .demo-section {
            margin-bottom: 1rem;
        }

        .demo-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--fg-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .demo-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .demo-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            color: var(--fg);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .demo-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--fg-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            background: var(--surface);
            color: var(--fg);
            transition: border-color 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--fg-muted);
            opacity: 0.6;
        }

        .analyze-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 1rem;
        }

        .analyze-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(217, 83, 79, 0.3);
        }

        .analyze-btn:active {
            transform: translateY(0);
        }

        .results {
            display: none;
        }

        .results.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .sentiment {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .sentiment.positive {
            color: var(--positive);
        }

        .sentiment.negative {
            color: var(--negative);
        }

        .confidence {
            text-align: right;
        }

        .confidence-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .confidence-label {
            font-size: 0.75rem;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .result-bar {
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .result-bar-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.6s ease;
        }

        .result-bar-fill.positive {
            background: var(--positive);
        }

        .result-bar-fill.negative {
            background: var(--negative);
        }

        .info-box {
            background: var(--accent-soft);
            border-radius: 10px;
            padding: 1rem;
            font-size: 0.9rem;
            color: var(--fg);
        }

        .info-box strong {
            display: block;
            margin-bottom: 0.25rem;
            color: var(--accent);
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--fg-muted);
            font-size: 0.85rem;
        }

        .theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌓</button>

    <div class="container">
        <header>
            <h1>💭 SentiNL</h1>
            <p class="subtitle">Customer Review Sentiment Analyzer</p>
        </header>

        <div class="card">
            <div class="demo-section">
                <div class="demo-label">Quick Examples</div>
                <div class="demo-buttons">
                    <button class="demo-btn" onclick="setReview('great')">🎬 Great Movie</button>
                    <button class="demo-btn" onclick="setReview('terrible')">🎬 Terrible Movie</button>
                    <button class="demo-btn" onclick="setReview('mixed')">🎬 Mixed Feelings</button>
                </div>
            </div>
        </div>

        <div class="card">
            <label for="reviewInput">Enter Your Review</label>
            <textarea id="reviewInput" placeholder="Type or paste your review here..."></textarea>
            <button class="analyze-btn" onclick="analyzeSentiment()">🔍 Analyze Sentiment</button>
        </div>

        <div class="card results" id="results">
            <div class="result-header">
                <div class="sentiment" id="sentimentLabel"></div>
                <div class="confidence">
                    <div class="confidence-value" id="confidenceValue"></div>
                    <div class="confidence-label">Confidence</div>
                </div>
            </div>
            <div class="result-bar">
                <div class="result-bar-fill" id="resultBar"></div>
            </div>
            <div class="info-box">
                <strong>How it works</strong>
                1. Text preprocessing (cleaning, tokenization, stemming)<br>
                2. TF-IDF vectorization (text → numbers)<br>
                3. Logistic Regression classification<br>
                4. Sentiment prediction with confidence
            </div>
        </div>

        <footer>
            SentiNL — NLP Sentiment Analysis Demo
        </footer>
    </div>

    <script>
        const reviews = {
            great: "This movie was absolutely fantastic! I loved every minute of it. The acting was superb and the storyline kept me engaged throughout. Highly recommend!",
            terrible: "What a waste of time. The plot was boring, the acting was terrible, and I couldn't wait for it to end. Total disaster. Would not watch again.",
            mixed: "The movie had some good moments but also many flaws. The acting was great but the pacing was slow. Overall it was okay."
        };

        // Simulated sentiment analysis (for demo purposes)
        // In the real app, this uses the trained TF-IDF + Logistic Regression model
        function analyzeSentimentReal(text) {
            const positiveWords = ['great', 'fantastic', 'excellent', 'amazing', 'wonderful', 'loved', 'superb', 'engaged', 'recommend', 'best', 'perfect', 'enjoyed', 'brilliant', 'outstanding'];
            const negativeWords = ['terrible', 'boring', 'waste', 'disaster', 'awful', 'horrible', 'bad', 'poor', 'slow', 'flaw', 'end', 'wait', 'couldn\'t', 'wouldn\'t'];

            const lowerText = text.toLowerCase();
            let posScore = 0;
            let negScore = 0;

            positiveWords.forEach(w => { if (lowerText.includes(w)) posScore++; });
            negativeWords.forEach(w => { if (lowerText.includes(w)) negScore++; });

            const total = posScore + negScore;
            if (total === 0) {
                return { sentiment: Math.random() > 0.5 ? 'positive' : 'negative', confidence: 0.55 };
            }

            const isPositive = posScore >= negScore;
            const confidence = 0.6 + (Math.min(total, 5) * 0.06);

            return {
                sentiment: isPositive ? 'positive' : 'negative',
                confidence: Math.min(confidence, 0.95)
            };
        }

        function setReview(type) {
            document.getElementById('reviewInput').value = reviews[type];
        }

        function analyzeSentiment() {
            const text = document.getElementById('reviewInput').value.trim();

            if (!text) {
                alert('Please enter a review to analyze.');
                return;
            }

            const result = analyzeSentimentReal(text);
            const resultsDiv = document.getElementById('results');
            const sentimentLabel = document.getElementById('sentimentLabel');
            const confidenceValue = document.getElementById('confidenceValue');
            const resultBar = document.getElementById('resultBar');

            const emoji = result.sentiment === 'positive' ? '😊' : '😞';
            const label = result.sentiment === 'positive' ? 'Positive' : 'Negative';
            const confPercent = (result.confidence * 100).toFixed(1);

            sentimentLabel.textContent = `${emoji} ${label}`;
            sentimentLabel.className = `sentiment ${result.sentiment}`;
            confidenceValue.textContent = `${confPercent}%`;
            confidenceValue.style.color = result.sentiment === 'positive' ? 'var(--positive)' : 'var(--negative)';

            resultBar.style.width = `${result.confidence * 100}%`;
            resultBar.className = `result-bar-fill ${result.sentiment}`;

            resultsDiv.classList.add('visible');
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
            }
        }

        // Check system preference for dark mode
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</body>
</html>
